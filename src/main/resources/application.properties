spring.application.name=like-hero-to-zero
server.address=127.0.0.1

spring.datasource.url=${EMISSIONS_DB_URL:jdbc:h2:file:./data/emissions}
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

app.data.csv=${EMISSIONS_CSV:../aufgabenunterlagen/GCB2025v15_MtCO2_flat.csv}
app.research.username=${RESEARCH_USERNAME:forschung}
app.research.password=${RESEARCH_PASSWORD:}

spring.messages.basename=messages
